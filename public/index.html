<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Label Detection</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.6rem; }
    form { border: 1px solid #ccc; padding: 20px; border-radius: 6px; }
    input[type=file] { display: block; margin-bottom: 16px; }
    button { padding: 8px 16px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Google Cloud Vision: Label Detection</h1>
  <p>Choose an image to upload. The server will return the labels detected in it.</p>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="pic" accept="image/*" required>
    <button type="submit">Upload &amp; Detect Labels</button>
  </form>
</body>
</html>
